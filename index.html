<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Inventory & Handover – The Ceylon Chamber of Commerce</title>
<style>
:root{--brand:#b5123e;--brand-d:#8e0e30;--bg:#f4f5f7;--card:#fff;--ink:#1c2130;--mute:#6b7280;--line:#e3e6eb;--ok:#117a45;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:32px;width:100%;max-width:380px;text-align:center}
.login-card img{height:78px;margin-bottom:8px}
.login-card h1{font-size:18px;margin:6px 0 2px}
.login-card p{color:var(--mute);margin:0 0 20px}
.field{text-align:left;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(181,18,62,.25);border-color:var(--brand)}
.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f3f4f6}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f3c2c2}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0}
/* layout */
header.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 22px;position:sticky;top:0;z-index:5}
header.top img{height:40px}
header.top .title{font-weight:700;line-height:1.1}
header.top .title small{display:block;font-weight:500;color:var(--mute);font-size:11px}
nav{display:flex;gap:4px;margin-left:24px}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mute)}
nav button.on{background:#fbe8ee;color:var(--brand)}
.spacer{flex:1}
main{max-width:1400px;margin:0 auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.toolbar input[type=search]{max-width:300px}
.toolbar select{width:auto}
.tablewrap{overflow:auto;max-height:calc(100vh - 290px)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#fafbfc;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);cursor:pointer;user-select:none}
tr:hover td{background:#fcf6f8}
td.wrap{white-space:normal;min-width:180px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#eef0f3;color:#444}
.tag.ok{background:#e3f5ea;color:var(--ok)}.tag.warn{background:#fff1dc;color:var(--warn)}.tag.bad{background:#fde4e4;color:var(--bad)}
.empty-cell{color:#b6bcc6}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;padding:22px}
.modal h2{margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid .full{grid-column:1/-1}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* handover form */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}nav{margin-left:0}header.top{flex-wrap:wrap}}
.pad{padding:16px}
.item-row{display:grid;grid-template-columns:1fr 1.5fr 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
.item-row textarea{min-height:64px;resize:vertical}
@media(max-width:800px){.item-row{grid-template-columns:1fr}}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
h3{margin:0 0 10px;font-size:15px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2130;color:#fff;padding:10px 18px;border-radius:8px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.note{background:#fff8e6;border:1px solid #f4dfa3;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* ---------- Printable handover (matches Handover.docx) ---------- */
#printArea{display:none}
.ho-page{width:210mm;min-height:297mm;padding:18mm 18mm 14mm;background:#fff;color:#000;font-family:Calibri,"Segoe UI",Arial,sans-serif;position:relative;margin:0 auto}
.ho-head{display:flex;align-items:center;gap:26px;border-bottom:1.5px solid #000;padding-bottom:14px;margin-bottom:26px}
.ho-head img{height:34mm}
.ho-head .t{flex:1;text-align:center}
.ho-head h1{font-size:19px;margin:0 0 12px}
.ho-head h2{font-size:17px;font-weight:400;margin:0}
.ho-table{width:100%;border-collapse:collapse;margin-bottom:26px}
.ho-table th,.ho-table td{border:1px solid #000;padding:6px 8px;vertical-align:top;white-space:pre-line;text-align:left;font-size:13px;background:none;position:static;color:#000;text-transform:none;letter-spacing:0}
.ho-table th{text-align:center;font-weight:400;font-size:15px;padding:3px}
.ho-table td{height:30px}
.ho-sign{display:flex;justify-content:space-between;margin-top:34px;font-size:14px}
.ho-sign div{width:46%;line-height:2}
.ho-sign .line{margin-top:34px}
.ho-sign .sg{padding-left:50px}
.ho-no{text-align:center;margin-top:30px;font-size:13px}
.ho-foot{position:absolute;right:18mm;bottom:16mm;text-align:right;font-size:11px;line-height:1.9}
.ho-foot small{display:block;font-size:9px;margin-top:10px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .ho-page{margin:0}
}
</style>
</head>

            <div class="full"><label>Internal note (not printed)</label><input id="hRemarks"></div>
          </div>
          <datalist id="people"></datalist>

          <h3 style="margin-top:20px">Add from inventory</h3>
          <input id="hPick" list="assetList" placeholder="Type device name, S/N or user…" oninput="pickAsset()">
          <datalist id="assetList"></datalist>
          <div class="quick">
            <span style="color:var(--mute);font-size:12px;align-self:center">Quick add:</span>
            <button class="btn ghost sm" onclick="addItem('Laptop Charger','*','-')">Charger</button>
            <button class="btn ghost sm" onclick="addItem('Laptop Bag','-','-')">Bag</button>
            <button class="btn ghost sm" onclick="addItem('Mouse','-','-')">Mouse</button>
            <button class="btn ghost sm" onclick="addItem('Monitor','','-')">Monitor</button>
            <button class="btn ghost sm" onclick="addItem('','','-')">Blank row</button>
          </div>
          <label style="margin-top:14px;text-transform:none;font-weight:500"><input type="checkbox" id="hUpdate" checked style="width:auto"> Update <b>Current User</b> of linked inventory items to the person taking over</label>
          <div class="actions">
            <button class="btn ghost" onclick="resetHandover()">Clear</button>
            <button class="btn ghost" onclick="previewHandover()">Preview / Print only</button>
            <button class="btn" id="saveHo" onclick="saveHandover()">Save & Print</button>
          </div>
        </div>

        <div class="panel pad">
          <h3>Items to hand over</h3>
          <div id="hItems"></div>
          <div id="hEmpty" style="color:var(--mute)">No items yet – pick a device from inventory or use quick add.</div>
        </div>
      </div>
    </div>

    <!-- History -->
    <div id="v-his" class="hidden">
      <div class="panel">
        <div class="toolbar"><input type="search" id="hq" placeholder="Search handovers…" oninput="renderHis()"></div>
        <div class="tablewrap"><table>
          <thead><tr><th>No</th><th>Date</th><th>Handing over</th><th>Taking over</th><th>Items</th><th></th></tr></thead>
          <tbody id="hisBody"></tbody>
        </table></div>
      </div>
    </div>
  </main>
</section>

<!-- Asset modal -->
<div id="assetModal" class="modal-bg hidden"><div class="modal">
  <h2 id="amTitle">Device</h2>
  <div class="grid">
    <div><label>Device name</label><input id="a_device"></div>
    <div><label>Current user</label><input id="a_user" list="people"></div>
    <div><label>Make</label><input id="a_make" list="makes" placeholder="HP, Dell, Lenovo…"></div>
    <div><label>Model</label><input id="a_model"></div>
    <div><label>Serial number (S/N)</label><input id="a_serial"></div>

    <button class="btn danger" id="amDel" onclick="delAsset()">Delete</button>
    <div class="spacer"></div>
    <button class="btn ghost" onclick="closeAsset()">Cancel</button>
    <button class="btn" id="amSave" onclick="saveAsset()">Save</button>
  </div>

</div></div>

const store = { get: k => { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} }, del: k => { try { sessionStorage.removeItem(k); } catch (e) {} } };
const S = { token: store.get('tok'), inv: [], his: [], items: [], sort: 'device', dir: 1, editing: null };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(action, data = {}) {
  if (!API_URL || API_URL.startsWith('PASTE')) throw new Error('API_URL is not set in index.html');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: S.token, ...data }) });
  const j = await r.json();
  if (j.error === 'AUTH') { logout(true); throw new Error('Session expired – please sign in again'); }
  if (j.error) throw new Error(j.error);
  return j.data;
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ---------- auth ---------- */
async function doLogin(e) {
  e.preventDefault(); $('lerr').textContent = ''; $('lbtn').disabled = true;
  try {
    const r = await api('login', { username: $('lu').value.trim(), password: $('lp').value });
    S.token = r.token; store.set('tok', S.token); $('lp').value = '';
    await boot();
  } catch (x) { $('lerr').textContent = x.message; }
  $('lbtn').disabled = false;
}
function logout(silent) {
  S.token = ''; store.del('tok');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  if (silent) $('lerr').textContent = 'Session expired – please sign in again';
}
async function boot() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('hDate').value = new Date().toISOString().slice(0, 10);
  await Promise.all([loadInv(), loadHis()]);
}
async function loadInv() { S.inv = await api('listInventory'); fillFilters(); renderInv(); fillLists(); }
async function loadHis() { S.his = await api('listHandovers'); renderHis(); }

/* ---------- nav ---------- */
function show(v) {
  ['inv','new','his'].forEach(k => { $('v-' + k).classList.toggle('hidden', k !== v); $('n-' + k).classList.toggle('on', k === v); });
}

/* ---------- inventory ---------- */
function dupSerials() {
  const c = {}; S.inv.forEach(a => { const s = (a.serial || '').trim().toUpperCase(); if (s) c[s] = (c[s] || 0) + 1; });
  return new Set(Object.keys(c).filter(k => c[k] > 1));
}
function fillFilters() {
  const mk = [...new Set(S.inv.map(a => a.make).filter(Boolean))].sort();
  const st = [...new Set(S.inv.map(a => a.status).filter(Boolean))].sort();
  const keep = [$('fMake').value, $('fStatus').value];
  $('fMake').innerHTML = '<option value="">All makes</option>' + mk.map(m => `<option>${esc(m)}</option>`).join('');
  $('fStatus').innerHTML = '<option value="">All status</option>' + st.map(m => `<option>${esc(m)}</option>`).join('');
  $('fMake').value = keep[0]; $('fStatus').value = keep[1];
}
function fillLists() {
  const users = [...new Set(S.inv.map(a => a.user).filter(Boolean))].sort();
  $('people').innerHTML = users.map(u => `<option value="${esc(u)}">`).join('');
  $('assetList').innerHTML = S.inv.map(a => `<option value="${esc(a.id + ' | ' + a.device + ' | ' + (a.serial || 'no S/N') + (a.user ? ' | ' + a.user : ''))}">`).join('');
}
function renderInv() {
  const dup = dupSerials(), q = $('q').value.toLowerCase(), fm = $('fMake').value, fs = $('fStatus').value, fd = $('fDup').checked;
  let rows = S.inv.filter(a =>
    (!fm || a.make === fm) && (!fs || a.status === fs) &&
    (!fd || dup.has((a.serial || '').toUpperCase())) &&
    (!q || Object.values(a).join(' ').toLowerCase().includes(q)));
  rows.sort((a, b) => String(a[S.sort] || '').localeCompare(String(b[S.sort] || ''), undefined, { numeric: true, sensitivity: 'base' }) * S.dir);

  $('invHead').innerHTML = COLS.map(([k, l]) => `<th onclick="sortBy('${k}')">${l}${S.sort === k ? (S.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '<th></th>';
  $('invBody').innerHTML = rows.map(a => `<tr>` + COLS.map(([k]) => {
    let v = a[k];
    if (k === 'status') return `<td><span class="tag ${v === 'In Use' ? 'ok' : v === 'Under Repair' ? 'warn' : v === 'Disposed' ? 'bad' : ''}">${esc(v || '-')}</span></td>`;
    if (k === 'serial' && v && dup.has(v.toUpperCase())) return `<td>${esc(v)} <span class="tag warn" title="Same S/N appears on more than one device">dup</span></td>`;
    return `<td>${v ? esc(v) : '<span class="empty-cell">—</span>'}</td>`;
  }).join('') + `<td><button class="btn ghost sm" onclick="openAsset('${esc(a.id)}')">Edit</button></td></tr>`).join('')
    || `<tr><td colspan="12" style="padding:30px;text-align:center;color:var(--mute)">No devices found</td></tr>`;

  const inUse = S.inv.filter(a => a.status === 'In Use').length;
  const missing = S.inv.filter(a => !a.os || !a.ram || !a.cpu || !a.disk || !a.purchased).length;
  $('stats').innerHTML = [[S.inv.length, 'Total devices'], [inUse, 'In use'], [S.inv.filter(a => a.status === 'In Stock').length, 'In stock'],
    [missing, 'Specs incomplete'], [dup.size, 'Duplicate S/Ns']].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('stats').insertAdjacentHTML('beforeend', `<div class="stat"><b>${rows.length}</b><span>Showing</span></div>`);
}
function sortBy(k) { if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = 1; } renderInv(); }

const F = ['device','make','model','serial','os','ram','cpu','disk','purchased','user','status','remarks'];
function openAsset(id) {
  const a = id ? S.inv.find(x => x.id === id) : { status: 'In Use' };
  S.editing = id || null;
  $('amTitle').textContent = id ? `Edit ${a.id}` : 'Add device';
  F.forEach(k => $('a_' + k).value = a[k] || '');
  $('amDel').classList.toggle('hidden', !id); $('aerr').textContent = '';
  const h = id ? S.his.filter(x => (x.assetIds || '').split(',').map(s => s.trim()).includes(id)) : [];
  $('amHist').innerHTML = h.length ? `<h3 style="margin-top:18px">Handover history</h3>` + h.map(x => `<div style="padding:5px 0;border-top:1px solid var(--line)"><b>${esc(x.no)}</b> · ${esc(x.date)} · ${esc(x.from)} → ${esc(x.to)}</div>`).join('') : '';
  $('assetModal').classList.remove('hidden');
}
function closeAsset() { $('assetModal').classList.add('hidden'); }
async function saveAsset() {
  const a = {}; F.forEach(k => a[k] = $('a_' + k).value.trim()); if (S.editing) a.id = S.editing;
  $('amSave').disabled = true; $('aerr').textContent = '';
  try { await api('saveAsset', { asset: a }); closeAsset(); await loadInv(); toast('Saved'); }
  catch (x) { $('aerr').textContent = x.message; }
  $('amSave').disabled = false;
}
async function delAsset() {
  if (!confirm('Delete this device from inventory? This cannot be undone.')) return;
  try { await api('deleteAsset', { id: S.editing }); closeAsset(); await loadInv(); toast('Deleted'); }
  catch (x) { $('aerr').textContent = x.message; }
}
function exportCsv() {
  const keys = ['id', ...F], head = ['Asset ID', ...COLS.map(c => c[1]).slice(0, 0), 'Device Name','Make','Model','Serial Number','OS','RAM','Processor','Hard Disk','Purchased Date','Current User','Status','Remarks'];
  const csv = [head, ...S.inv.map(a => keys.map(k => a[k] || ''))].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  l.download = 'inventory-' + new Date().toISOString().slice(0, 10) + '.csv'; l.click();
}

/* ---------- handover ---------- */
function specText(a) {
  const mm = (a.model || '').toLowerCase().startsWith((a.make || '#').toLowerCase()) ? a.model : (a.make + ' ' + a.model);
  const l = [mm.trim() || a.device];
  if (a.cpu) l.push(a.cpu); if (a.ram) l.push(a.ram + (/ram/i.test(a.ram) ? '' : ' RAM')); if (a.disk) l.push(a.disk + (/disk|ssd|hdd/i.test(a.disk) ? '' : ' Hard Disk'));
  if (a.os) l.push(a.os); if (a.serial) l.push('S/N – ' + a.serial);
  return l.join('\n');
}
function itemName(a) {
  const m = (a.model || '').toLowerCase();
  return /desktop|optiplex|prodesk|compaq|mt pc|\bpc\b/.test(m) && !/notebook|book/.test(m) ? ((a.make || '') + ' Desktop').trim() : ((a.make || '') + ' Laptop').trim();
}
function pickAsset() {
  const v = $('hPick').value; if (!v.includes(' | ')) return;
  const a = S.inv.find(x => x.id === v.split(' | ')[0]); if (!a) return;
  if (S.items.some(i => i.assetId === a.id)) { toast('Already added'); $('hPick').value = ''; return; }
  S.items.push({ item: itemName(a), spec: specText(a), remarks: '-', assetId: a.id });
  if (!$('hFrom').value && a.user) $('hFrom').value = a.user;
  $('hPick').value = ''; renderItems();
}
function addItem(item, spec, remarks) { S.items.push({ item, spec, remarks, assetId: '' }); renderItems(); }
function renderItems() {
  $('hEmpty').classList.toggle('hidden', S.items.length > 0);
  $('hItems').innerHTML = S.items.map((it, i) => `<div class="item-row">
    <input value="${esc(it.item)}" placeholder="Item" oninput="S.items[${i}].item=this.value">
    <textarea placeholder="Model & S/N" oninput="S.items[${i}].spec=this.value">${esc(it.spec)}</textarea>
    <input value="${esc(it.remarks)}" placeholder="Remarks" oninput="S.items[${i}].remarks=this.value">
    <button class="btn danger sm" onclick="S.items.splice(${i},1);renderItems()">✕</button></div>
    ${it.assetId ? `<div style="font-size:11px;color:var(--mute);margin:-4px 0 8px">Linked to inventory ${esc(it.assetId)}</div>` : ''}`).join('');
}
function resetHandover() { S.items = []; ['hFrom','hTo','hRemarks'].forEach(k => $(k).value = ''); renderItems(); }
function hoData() {
  return { date: $('hDate').value, from: $('hFrom').value.trim(), to: $('hTo').value.trim(), remarks: $('hRemarks').value.trim(),
    items: S.items.filter(i => i.item || i.spec), updateUsers: $('hUpdate').checked, setStatus: 'In Use' };
}
function validate(h) {
  if (!h.items.length) return 'Add at least one item'; if (!h.from || !h.to) return 'Enter both names'; if (!h.date) return 'Pick a date'; return '';
}
function fmtDate(d) { const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function stamp() {
  const d = new Date(), D = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let h = d.getHours(), ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  const off = -d.getTimezoneOffset(), sg = off >= 0 ? '+' : '-', oh = Math.floor(Math.abs(off) / 60), om = Math.abs(off) % 60;
  return `${D[d.getDay()]}, ${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}  ${h}:${String(d.getMinutes()).padStart(2, '0')} (GMT${sg}${oh}${om ? ':' + om : ''}) ${ap}`;
}
function printHandover(h, no) {
  const rows = h.items.map(i => `<tr><td style="width:27%">${esc(i.item)}</td><td style="width:41%">${esc((i.spec || '').trim())}</td><td>${esc(i.remarks || '-')}</td></tr>`).join('');
  $('printArea').innerHTML = `<div class="ho-page">
    <div class="ho-head"><img src="${LOGO}" alt=""><div class="t"><h1>The Ceylon Chamber of Commerce<br><span style="display:block;margin-top:12px">IT Department</span></h1><h2>Handover Document</h2></div></div>
    <table class="ho-table"><thead><tr><th>Item</th><th>Model &amp; S/N</th><th>Remarks</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="ho-sign">
      <div>Handing Over by,<br>Name : ${esc(h.from)}<br>Date : ${fmtDate(h.date)}<div class="line">_________________________</div><div class="sg">Signature</div></div>
      <div>Taking Over by,<br>Name : ${esc(h.to)}<br>Date : ${fmtDate(h.date)}<div class="line">_________________________</div><div class="sg">Signature</div></div>
    </div>
    ${no ? `<div class="ho-no">${esc(no)}</div>` : ''}
    <div class="ho-foot">IT Division,<br>The Ceylon Chamber of Commerce,<br>itservices@chamber.lk<small>${stamp()}</small></div>
  </div>`;
  setTimeout(() => window.print(), 150);
}
function previewHandover() {
  const h = hoData(), e = validate(h); if (e) return toast(e);
  printHandover(h, '');
}
async function saveHandover() {
  const h = hoData(), e = validate(h); if (e) return toast(e);
  $('saveHo').disabled = true;
  try {
    const rec = await api('createHandover', { handover: h });
    toast('Handover ' + rec.no + ' saved');
    await Promise.all([loadHis(), loadInv()]);
    printHandover(h, rec.no); resetHandover();
  } catch (x) { toast(x.message); }
  $('saveHo').disabled = false;
}

/* ---------- history ---------- */
function renderHis() {
  const q = $('hq').value.toLowerCase();
  $('hisBody').innerHTML = S.his.filter(h => !q || Object.values(h).join(' ').toLowerCase().includes(q)).map(h => {
    let items = []; try { items = JSON.parse(h.items); } catch (e) {}
    return `<tr><td><b>${esc(h.no)}</b></td><td>${esc(h.date)}</td><td>${esc(h.from)}</td><td>${esc(h.to)}</td>
      <td class="wrap">${items.map(i => esc(i.item)).join(', ')}</td>
      <td><button class="btn ghost sm" onclick="reprint('${esc(h.no)}')">Reprint</button></td></tr>`;
  }).join('') || `<tr><td colspan="6" style="padding:30px;text-align:center;color:var(--mute)">No handovers yet</td></tr>`;
}
function reprint(no) {
  const h = S.his.find(x => x.no === no); if (!h) return;
  printHandover({ date: h.date, from: h.from, to: h.to, items: JSON.parse(h.items) }, h.no);
}

/* ---------- start ---------- */
if (S.token) boot().catch(() => logout());
</script>
</body>
</html>
